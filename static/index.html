<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<style>
  :root{
    --bg: #F6F7F8;
    --panel: #FFFFFF;
    --panel-2: #FBFBFC;
    --hairline: #DFE3E8;
    --text: #1A1D24;
    --muted: #6B7280;
    --navy: #1E3A5F;
    --navy-soft: #E7EDF3;
    --rust: #C4571F;
    --rust-soft: #FBEAE0;
    --teal: #2F7A5C;
    --teal-soft: #E5F2ED;
    --slate: #4E7FB5;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1440px; margin:0 auto; padding:24px 20px 60px;}

  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding-bottom:16px; margin-bottom:20px; border-bottom:2px solid var(--navy);
    flex-wrap:wrap; gap:14px;
  }
  .title-block h1{ font-size:21px; font-weight:700; margin:0 0 4px; color:var(--navy); letter-spacing:-0.01em; }
  .title-block p{ margin:0; color:var(--muted); font-size:12.5px; }

  .status-col{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; font-size:12px; color:var(--muted); }
  .status-row{ display:flex; align-items:center; gap:8px; }
  .pulse{ width:7px; height:7px; border-radius:50%; background:var(--teal); flex:none; }
  .pulse.error{ background:#C0392B; }

  button{
    background: var(--panel); border:1px solid var(--hairline); color:var(--navy);
    font-family:inherit; font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px;
    cursor:pointer;
  }
  button:hover{ border-color:var(--navy); background:var(--navy-soft); }
  button:disabled{ opacity:0.5; cursor:default; }
  input[type=file]{ font-size:11px; color:var(--muted); max-width:170px; }
  input[type=text]{
    font-family:inherit; font-size:13px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--text); width:280px;
  }
  input[type=text]:focus{ outline:2px solid var(--slate); outline-offset:1px; }

  .hierarchy-box{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--hairline);
    border-radius:8px; padding:6px 10px; font-size:11.5px;
  }

  /* KPI summary strip */
  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px;
    padding:14px 16px 12px; border-top:3px solid var(--navy);
  }
  .kpi-card.rust{ border-top-color:var(--rust); }
  .kpi-card .label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .kpi-card .value{ font-family:Consolas,'Cascadia Mono',monospace; font-size:22px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .kpi-card.rust .value{ color:var(--rust); }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .vertical-filter{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .vertical-filter label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; }
  .vertical-filter select{
    font-family:inherit; font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:8px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--navy); cursor:pointer;
  }
  .vertical-filter select:focus{ outline:2px solid var(--slate); outline-offset:1px; }

  /* Location multi-select */
  .multiselect{ position:relative; display:inline-block; }
  .multiselect-trigger{
    font-family:inherit; font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:8px;
    border:1px solid var(--hairline); background:var(--panel); color:var(--navy); cursor:pointer;
    min-width:140px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .multiselect-trigger:focus{ outline:2px solid var(--slate); outline-offset:1px; }
  .multiselect-trigger.has-selection{ border-color:var(--navy); font-weight:600; }
  .multiselect-panel{
    position:absolute; top:calc(100% + 4px); left:0; z-index:50; min-width:260px; max-width:340px;
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px;
    box-shadow:0 8px 24px rgba(26,29,36,0.12); padding:8px;
  }
  .multiselect-actions{ display:flex; gap:8px; padding:2px 4px 8px; border-bottom:1px solid var(--hairline); margin-bottom:6px; }
  .multiselect-actions button{
    font-family:inherit; font-size:11px; font-weight:600; color:var(--navy); background:none;
    border:none; cursor:pointer; padding:2px 4px;
  }
  .multiselect-actions button:hover{ text-decoration:underline; }
  .multiselect-options{ max-height:260px; overflow-y:auto; }
  .multiselect-option{
    display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:12.5px; cursor:pointer;
    border-radius:5px;
  }
  .multiselect-option:hover{ background:var(--navy-soft); }
  .multiselect-option input{ cursor:pointer; }
  .multiselect-empty{ padding:8px 4px; font-size:12px; color:var(--muted); }

  .tab{
    padding:7px 14px; border-radius:8px; border:1px solid var(--hairline); background:var(--panel);
    color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .tab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .tree-panel{ background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius); overflow:hidden; }
  .tree-header, .tree-row{
    display:grid; align-items:center;
    grid-template-columns: minmax(200px,2fr) 60px repeat(7, 90px);
    gap:6px; padding:9px 14px;
  }
  .tree-header{
    background:var(--panel-2); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); border-bottom:1px solid var(--hairline); font-weight:600;
  }
  .tree-header .num, .tree-row .num{ text-align:right; }
  .tree-row{ border-bottom:1px solid #EEF0F2; font-size:13px; cursor:pointer; }
  .tree-row:hover{ background:var(--navy-soft); }
  .tree-row.dimmed{ opacity:0.35; }
  .tree-row .num{ font-family:Consolas,'Cascadia Mono',monospace; font-variant-numeric:tabular-nums; }
  .name-cell{ display:flex; align-items:center; gap:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .caret{ display:inline-block; width:12px; color:var(--muted); flex:none; }
  .depth-0{ font-weight:700; }
  .depth-0 .name-cell{ color:var(--navy); }
  .depth-1 .name-cell{ padding-left:20px; }
  .depth-2 .name-cell{ padding-left:40px; }
  .depth-3 .name-cell{ padding-left:60px; font-weight:400; }

  /* Employee-level sub-table — distinct column set from the ZM/RM/Location rollup rows above it */
  .emp-table{ border-top:1px solid var(--hairline); }
  .emp-header, .emp-row{
    display:grid;
    grid-template-columns: 1.5fr 60px 70px 65px 80px 75px 70px 90px 75px 60px 80px;
    gap:6px; padding:7px 12px 7px 60px; align-items:center;
  }
  .emp-header{
    background:var(--panel-2); font-size:9px; text-transform:uppercase; letter-spacing:0.02em;
    color:var(--muted); font-weight:600; border-bottom:1px solid var(--hairline); text-align:center;
  }
  .emp-header .emp-name-head{ text-align:left; }
  .emp-row{ font-size:12.5px; border-bottom:1px solid #EEF0F2; cursor:pointer; }
  .emp-row:hover{ background:var(--navy-soft); }
  .emp-row.dimmed{ opacity:0.35; }
  .emp-row .emp-num{ text-align:center; font-family:Consolas,monospace; font-variant-numeric:tabular-nums; }
  .emp-row .emp-name{ display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .emp-row .emp-name:hover{ color:var(--navy); text-decoration:underline; }
  .emp-manager-row{ background:var(--panel-2); font-weight:700; cursor:default; }
  .emp-manager-row:hover{ background:var(--panel-2); }
  .emp-manager-row .emp-name{ color:var(--navy); }

  .depth-3{ cursor:pointer; }
  .depth-3:hover .name-cell{ color:var(--navy); text-decoration:underline; }
  .flag-badge{
    display:inline-block; background:var(--rust-soft); color:var(--rust); font-size:9.5px; font-weight:700;
    padding:2px 7px; border-radius:20px; margin-left:6px; flex:none; border:1px solid var(--rust);
  }
  .headcount-pill{ color:var(--muted); font-size:11px; }
  mark{ background:#FCE8B8; color:inherit; border-radius:2px; padding:0 1px; }

  .empty-cell{ color:#C7CBD1; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,22,26,0.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius);
    max-width:720px; width:100%; max-height:85vh; overflow-y:auto; padding:22px 24px;
  }
  .modal h3{ margin:0 0 4px; font-size:17px; color:var(--navy); }
  .modal .sub{ color:var(--muted); font-size:12px; margin-bottom:16px; }
  .modal-section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;
    color:var(--navy); margin:18px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--navy-soft);
  }
  .modal-section-label:first-of-type{ margin-top:0; }
  .kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; }
  .kv-row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid #EEF0F2; font-size:12.5px; }
  .kv-row .k{ color:var(--muted); }
  .kv-row .v{ font-family:Consolas,monospace; font-variant-numeric:tabular-nums; text-align:right; }
  .modal-close{ float:right; }

  .error-banner{ text-align:center; padding:40px 20px; color:#C0392B; }
  .loading{ text-align:center; padding:40px 20px; color:var(--muted); }

  /* Funnels: three equal-width columns side by side, so all three fit on
     screen without scrolling. Stacks back to one column on narrow screens. */
  .funnel-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:24px; align-items:stretch;
  }
  @media (max-width: 900px){
    .funnel-grid{ grid-template-columns:1fr; }
  }
  .funnel-col{
    background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:16px 16px 12px; display:flex; flex-direction:column;
  }
  .funnel-header{ margin-bottom:10px; }
  .funnel-header h2{ font-size:13.5px; font-weight:700; color:var(--navy); margin:0; }
  .funnel-header .sub{ font-size:10px; color:var(--muted); display:block; margin-top:2px; }
  .funnel-unavailable{
    background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:30px; text-align:center; color:var(--muted); font-size:13px;
  }

  /* Compact vertical bar chart -- one bar per funnel stage, height scaled to
     the first (largest) stage. Chosen over a pie chart because funnel
     stages are nested subsets of each other (L2 Met is part of Total, not a
     separate slice of a whole), which a pie chart would misrepresent. */
  .bar-chart{
    display:flex; align-items:flex-end; justify-content:space-around; gap:8px;
    height:150px; padding-top:8px; border-bottom:1px solid var(--hairline);
  }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%; min-width:0; }
  .bar-value{ font-family:Consolas,monospace; font-weight:700; font-size:12.5px; color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bar-pct{ font-family:Consolas,monospace; font-size:9.5px; color:var(--muted); margin-bottom:3px; }
  .bar-shape{ width:60%; max-width:38px; background:var(--navy); border-radius:4px 4px 0 0; min-height:2px; transition:height 0.3s; }
  .bar-labels{ display:flex; justify-content:space-around; gap:8px; padding-top:6px; }
  .bar-label{
    flex:1; min-width:0; text-align:center; font-size:9.5px; font-weight:600; color:var(--text);
    line-height:1.25; overflow-wrap:break-word;
  }

  .funnel-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-top:16px; }
  .funnel-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px; padding:14px 16px;
    border-top:3px solid var(--slate);
  }
  .funnel-card .label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .funnel-card .value{ font-family:Consolas,monospace; font-size:20px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }

  @media (max-width: 900px){
    .tree-header, .tree-row{ grid-template-columns: minmax(150px,1.4fr) 45px repeat(7, 70px); font-size:11px; }
  }

  /* ---- Data uploads (HC / Sales / App install) ---- */
  .upload-panel{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:6px 10px; align-items:center;
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px; padding:8px 12px; font-size:11.5px;
    max-width:720px;
  }
  .upload-panel .upl-name{ font-weight:700; color:var(--navy); white-space:nowrap; }
  .upload-panel .upl-status{ color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upload-panel .upl-status.warn{ color:var(--rust); }
  .upload-panel button{ padding:4px 10px; white-space:nowrap; }
  .upload-panel .upl-auto{ font-size:10.5px; font-weight:700; color:var(--teal); background:var(--teal-soft);
    border-radius:20px; padding:2px 9px; justify-self:start; white-space:nowrap; }
  .upload-panel .btn-subtle{ font-weight:500; color:var(--muted); border-color:transparent; background:none; }
  .upload-panel .btn-subtle:hover{ color:var(--navy); border-color:var(--hairline); }
  @media (max-width: 700px){
    .upload-panel{ grid-template-columns:auto minmax(0,1fr) auto; }
    .upload-panel .upl-status{ grid-column:1 / -1; order:0; white-space:normal; }
  }

  /* ---- View switch ---- */
  .view-switch{ display:inline-flex; border:1px solid var(--navy); border-radius:9px; overflow:hidden; margin-bottom:14px; }
  .view-switch button{
    border:none; border-radius:0; padding:8px 18px; font-size:13px; background:var(--panel); color:var(--navy);
  }
  .view-switch button + button{ border-left:1px solid var(--navy); }
  .view-switch button.active{ background:var(--navy); color:#fff; }

  /* ---- App Install view ---- */
  .tree-panel.app-mode .tree-header, .tree-panel.app-mode .tree-row{
    grid-template-columns: minmax(220px,2fr) 60px repeat(6, 100px);
  }
  .app-emp .emp-header, .app-emp .emp-row{
    grid-template-columns: 1.6fr 60px repeat(6, 90px);
  }
  .num.good, .emp-num.good{ color:var(--teal); font-weight:700; }
  .num.bad, .emp-num.bad{ color:var(--rust); font-weight:700; }
  .hbar-list{ display:flex; flex-direction:column; gap:7px; max-height:196px; overflow-y:auto; padding-right:4px; }
  .hbar-row{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px; gap:8px; align-items:center; font-size:11.5px; }
  .hbar-row .hb-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-track{ position:relative; height:12px; background:var(--navy-soft); border-radius:3px; }
  .hbar-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--navy); border-radius:3px; }
  .hbar-fill.bad{ background:var(--rust); }
  .hbar-avg{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); }
  .hbar-row .hb-val{ font-family:Consolas,monospace; text-align:right; font-variant-numeric:tabular-nums; }
  .lead-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  @media (max-width: 900px){ .lead-grid{ grid-template-columns:1fr; } }
  .lead-block + .lead-block{ margin-top:14px; }
  .lead-title{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--navy); margin-bottom:4px; }
  .lead-table{ width:100%; border-collapse:collapse; font-size:12.5px; table-layout:fixed; }
  .lead-table th{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:600;
    text-align:right; padding:5px 6px; border-bottom:1px solid var(--hairline); }
  .lead-table th:first-child{ text-align:left; width:46%; }
  .lead-table td{ padding:6px; border-bottom:1px solid #EEF0F2; text-align:right;
    font-family:Consolas,monospace; font-variant-numeric:tabular-nums; }
  .lead-table td:first-child{ text-align:left; font-family:inherit; }
  .lead-table td.good{ color:var(--teal); font-weight:700; }
  .lead-table td.bad{ color:var(--rust); font-weight:700; }
  .lead-table tr.clickable{ cursor:pointer; }
  .lead-table tr.clickable:hover{ background:var(--navy-soft); }
  .lead-name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lead-sub{ font-size:10.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .app-note{ font-size:11.5px; color:var(--muted); margin:10px 2px 0; line-height:1.5; }
  .app-empty{ background:var(--panel); border:1px solid var(--hairline); border-radius:var(--radius); padding:40px; text-align:center; color:var(--muted); }
  .modal table.app-hist{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .modal table.app-hist th, .modal table.app-hist td{ padding:6px 8px; border-bottom:1px solid #EEF0F2; text-align:right; }
  .modal table.app-hist th{ font-size:10.5px; text-transform:uppercase; color:var(--muted); letter-spacing:0.04em; }
  .modal table.app-hist th:first-child, .modal table.app-hist td:first-child{ text-align:left; }
  .modal table.app-hist td{ font-family:Consolas,monospace; font-variant-numeric:tabular-nums; }
  .modal table.app-hist td:first-child{ font-family:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1 id="dash-title">Dashboard</h1>
      <p>ZM → RM → Location → L1 performance register</p>
    </div>
    <div class="status-col">
      <div class="status-row">
        <span class="pulse" id="pulse-dot"></span>
        <span id="updated-text">connecting…</span>
        <button id="refresh">Refresh data</button>
      </div>
      <div class="upload-panel">
        <span class="upl-name">HC sheet</span>
        <span class="upl-status" id="hierarchy-status">—</span>
        <input type="file" id="hierarchy-file" accept=".xlsx" />
        <button id="hierarchy-upload">Upload</button>

        <span class="upl-name">Sales dump</span>
        <span class="upl-status" id="sales-status">—</span>
        <input type="file" id="sales-file" accept=".xlsx,.csv" />
        <button id="sales-upload">Upload</button>

        <span class="upl-name">App install</span>
        <span class="upl-status" id="app-status">—</span>
        <input type="file" id="app-file" accept=".xlsx,.csv" hidden />
        <span class="upl-auto" title="Filled automatically by the daily push_local.py run (Redash query 52336)">auto · daily</span>
        <button id="app-upload" class="btn-subtle" title="Backup only: upload the meeting-level export by hand if the automatic push failed">Manual upload…</button>
      </div>
    </div>
  </header>

  <div class="view-switch" id="view-switch">
    <button type="button" data-view="perf" class="active">Performance</button>
    <button type="button" data-view="app">App Install</button>
  </div>

  <div class="filter-row">
    <div class="tabs" id="period-tabs"></div>
    <div class="vertical-filter">
      <label for="vertical-select">Vertical</label>
      <select id="vertical-select"><option value="all">All Verticals</option></select>
      <label for="zm-select">ZM</label>
      <select id="zm-select"><option value="all">All ZMs</option></select>
      <label for="rm-select">RM</label>
      <select id="rm-select"><option value="all">All RMs</option></select>
      <label id="location-label">Location</label>
      <div class="multiselect" id="location-multiselect">
        <button type="button" class="multiselect-trigger" id="location-trigger" aria-haspopup="true" aria-expanded="false">All Locations</button>
        <div class="multiselect-panel" id="location-panel" hidden>
          <div class="multiselect-actions">
            <button type="button" id="location-select-all">Select All</button>
            <button type="button" id="location-clear-all">Clear</button>
          </div>
          <div class="multiselect-options" id="location-options"></div>
        </div>
      </div>
      <span id="turnover-wrap" style="display:contents">
      <label for="turnover-select">Turnover</label>
      <select id="turnover-select">
        <option value="all">All Turnover</option>
        <option value="under">&lt;1.5Cr</option>
        <option value="over">&ge;1.5Cr</option>
        <option value="no_gst">No GST</option>
      </select>
      </span>
    </div>
  </div>

  <div id="funnel-panel"></div>

  <div id="content"><div class="loading">Loading…</div></div>
</div>

<div id="modal-root"></div>

<script>

function relativeTime(ts){
  if(!ts) return 'never';
  const diff = Math.max(0, (Date.now()/1000) - ts);
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60) + ' min ago';
  if(diff < 86400) return Math.floor(diff/3600) + ' hr ago';
  return Math.floor(diff/86400) + ' day(s) ago';
}
function fmtNum(v){
  if(v === null || v === undefined) return '—';
  return Number(v).toLocaleString('en-IN', {maximumFractionDigits:0});
}
function fmtCurrency(v){
  if(v === null || v === undefined) return '—';
  return '₹' + Number(v).toLocaleString('en-IN', {maximumFractionDigits:0});
}

// Display name for a Performance period: weeks get their dates from the
// server (e.g. "Wk 16–22 Nov"), MTD shows the month.
function periodLabel(p){
  const labels = (dashboardData && dashboardData.perf_period_labels) || {};
  if(p === 'w1' || p === 'w2' || p === 'w3') return 'Wk ' + (labels[p] || p.toUpperCase());
  if(p === 'l3w') return 'Last 3 weeks';
  if(p === 'mtd') return PERIOD_LABELS.mtd + ' (MTD)';
  return PERIOD_LABELS[p] || p;
}

function buildTabs(){
  tabsEl.innerHTML = '';
  let entries;
  if(currentView === 'app'){
    entries = APP_PERIOD_ORDER.map(p => [p, appPeriodLabel(p)]);
  } else {
    const keys = perfPeriods();
    if(!keys.includes(currentPeriod)) currentPeriod = keys.includes('w1') ? 'w1' : keys.includes('mtd') ? 'mtd' : keys[0];
    entries = keys.map(k => [k, periodLabel(k)]);
  }
  const active = currentView === 'app' ? currentAppPeriod : currentPeriod;
  entries.forEach(([key,label]) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (key === active ? ' active' : '');
    tab.textContent = label;
    tab.addEventListener('click', () => {
      if(currentView === 'app'){
        currentAppPeriod = key;
        if(APP_TO_PERF[key] && perfPeriods().includes(APP_TO_PERF[key])) currentPeriod = APP_TO_PERF[key];
      } else {
        currentPeriod = key;
        if(PERF_TO_APP[key]) currentAppPeriod = PERF_TO_APP[key];
      }
      renderAll();
    });
    tabsEl.appendChild(tab);
  });
}

function populateHierarchyFilters(){
  const tree = dashboardData.tree;

  // ZM options: always every ZM present in the (vertical-filtered-by-backend) tree.
  const zmNames = new Set(Object.keys(tree));

  // RM options: only RMs under the currently selected ZM (if any); all RMs otherwise.
  const rmNames = new Set();
  Object.entries(tree).forEach(([zm, zmNode]) => {
    if(currentZmFilter !== 'all' && zm !== currentZmFilter) return;
    Object.keys(zmNode.rm_children).forEach(rm => rmNames.add(rm));
  });

  // Location options: only locations under the currently selected ZM *and* RM.
  const locationNames = new Set();
  Object.entries(tree).forEach(([zm, zmNode]) => {
    if(currentZmFilter !== 'all' && zm !== currentZmFilter) return;
    Object.entries(zmNode.rm_children).forEach(([rm, rmNode]) => {
      if(currentRmFilter !== 'all' && rm !== currentRmFilter) return;
      Object.keys(rmNode.location_children).forEach(loc => locationNames.add(loc));
    });
  });

  function refill(selectEl, names, allLabel, onReset){
    const current = selectEl.value || 'all';
    const sorted = [...names].sort();
    selectEl.innerHTML = `<option value="all">${allLabel}</option>` +
      sorted.map(n => `<option value="${escAttr(n)}">${escHtml(n)}</option>`).join('');
    // If the previously-selected value no longer exists under the new
    // parent filter, reset it to "all" — and sync the underlying state
    // variable too, since setting .value here doesn't fire a change event.
    if(sorted.includes(current)){
      selectEl.value = current;
    } else {
      selectEl.value = 'all';
      if(current !== 'all' && onReset) onReset();
    }
  }
  refill(zmSelectEl, zmNames, 'All ZMs');
  refill(rmSelectEl, rmNames, 'All RMs', () => { currentRmFilter = 'all'; });

  // Location: multi-select checkbox list instead of a single <option> refill.
  // Prune any previously-selected locations that no longer exist under the
  // current ZM/RM scope (e.g. ZM changed to one that doesn't have them).
  const sortedLocationNames = [...locationNames].sort();
  const validLocationSet = new Set(sortedLocationNames);
  currentLocationFilter = currentLocationFilter.filter(loc => validLocationSet.has(loc));
  renderLocationOptions(sortedLocationNames);
  updateLocationTriggerLabel();
}

function renderLocationOptions(sortedLocationNames){
  if(sortedLocationNames.length === 0){
    locationOptionsEl.innerHTML = `<div class="multiselect-empty">No locations in the current selection</div>`;
    return;
  }
  locationOptionsEl.innerHTML = sortedLocationNames.map(loc => `
    <label class="multiselect-option">
      <input type="checkbox" value="${escAttr(loc)}" ${currentLocationFilter.includes(loc) ? 'checked' : ''}>
      <span>${escHtml(loc)}</span>
    </label>
  `).join('');
}

function updateLocationTriggerLabel(){
  if(currentLocationFilter.length === 0){
    locationTriggerEl.textContent = 'All Locations';
    locationTriggerEl.classList.remove('has-selection');
  } else if(currentLocationFilter.length === 1){
    locationTriggerEl.textContent = currentLocationFilter[0];
    locationTriggerEl.classList.add('has-selection');
  } else {
    locationTriggerEl.textContent = `${currentLocationFilter.length} Locations`;
    locationTriggerEl.classList.add('has-selection');
  }
}

// Generic "scope this field by the current Turnover filter" helper. Works
// for any metrics object (ZM/RM/Location tree nodes or per-employee rows)
// and any base field that has _under/_over turnover-scoped counterparts
// (sales_count, combined_total, combined_l2_met, combined_converted,
// combined_converted_met, total_meet). "No GST" is the honest remainder
// (total - under - over) -- exact, since every lead falls into exactly one
// of the three buckets by construction. Falls back to the plain unscoped
// value if this field was never turnover-split (older pushed data) or "All
// Turnover" is selected.
function scopedValue(metrics, baseField){
  if(!metrics) return 0;
  if(currentTurnoverFilter === 'all' || metrics[baseField+'_under'] === undefined) return metrics[baseField] || 0;
  if(currentTurnoverFilter === 'under') return metrics[baseField+'_under'] || 0;
  if(currentTurnoverFilter === 'over') return metrics[baseField+'_over'] || 0;
  if(currentTurnoverFilter === 'no_gst') return (metrics[baseField]||0) - (metrics[baseField+'_under']||0) - (metrics[baseField+'_over']||0);
  return metrics[baseField] || 0;
}

// Per-employee HP/HL (combined, deduplicated) numbers, scoped by the current
// Turnover filter. Exact -- combined_total_under/over etc are computed
// directly per employee (same dedup logic as the unscoped "All Turnover"
// total, just split by turnover bucket), not approximated by adding
// separate HP-scoped and HL-scoped numbers together.
function empScopedMetrics(m){
  return {
    total: scopedValue(m, 'combined_total'), l2met: scopedValue(m, 'combined_l2_met'),
    converted: scopedValue(m, 'combined_converted'), convertedMet: scopedValue(m, 'combined_converted_met'),
  };
}

// Per-employee Total Meet, scoped by the current Turnover filter. Fresh %
// stays unscoped regardless of this filter -- fresh_meet itself was never
// split by turnover, so pairing a scoped total with an unscoped fresh count
// would produce a meaningless (or >100%) percentage.
function empScopedTotalMeet(m){
  return scopedValue(m, 'total_meet');
}

    const agg = { app_met:0, app_before:0, app_after:0, app_none:0 };
    Object.values(children).forEach(child => {
      const m = child.metrics[period];
      if(!m) return;
      APP_KEYS.forEach(k => { agg[k] += m[k] || 0; });
    });
    metrics[period] = agg;

  for(const period of allPeriods){

        agg.hl_l2_met_over = (agg.hl_l2_met_over||0) + (m.hl_l2_met_over||0);
        agg.hl_converted_over = (agg.hl_converted_over||0) + (m.hl_converted_over||0);
        agg.hl_converted_met_over = (agg.hl_converted_met_over||0) + (m.hl_converted_met_over||0);
        agg.hl_tp_over_200_over = (agg.hl_tp_over_200_over||0) + (m.hl_tp_over_200_over||0);
      }
    });
    metrics[period] = agg;
  }
  return { metrics, headcount };
}

function getFilteredTree(){
  const tree = dashboardData.tree;
  const locationActive = currentLocationFilter.length > 0;
  const noFilter = currentZmFilter === 'all' && currentRmFilter === 'all' && !locationActive;
  if(noFilter) return tree;

  const result = {};
  for(const [zm, zmNode] of Object.entries(tree)){
    if(currentZmFilter !== 'all' && zm !== currentZmFilter) continue;

    const rmChildren = {};
    for(const [rm, rmNode] of Object.entries(zmNode.rm_children)){
      if(currentRmFilter !== 'all' && rm !== currentRmFilter) continue;

      const locationChildren = {};
      for(const [loc, locNode] of Object.entries(rmNode.location_children)){
        if(locationActive && !currentLocationFilter.includes(loc)) continue;
        locationChildren[loc] = locNode;
      }
      if(Object.keys(locationChildren).length === 0) continue;
      const locationFiltered = locationActive;
      const { metrics, headcount } = locationFiltered ? sumChildMetrics(locationChildren) : { metrics: rmNode.metrics, headcount: rmNode.headcount };
      rmChildren[rm] = { metrics, headcount, location_children: locationChildren };
    }
    if(Object.keys(rmChildren).length === 0) continue;
    const rmOrLocFiltered = currentRmFilter !== 'all' || locationActive;
    const { metrics, headcount } = rmOrLocFiltered ? sumChildMetrics(rmChildren) : { metrics: zmNode.metrics, headcount: zmNode.headcount };
    result[zm] = { metrics, headcount, rm_children: rmChildren };
  }
  return result;
}

function metricCells(metrics, period){
  const showHot = hasHotFields(period);
  const cells = [ fmtNum(scopedValue(metrics, 'sales_count')) ];
  if(showHot){
    // Uses the deduplicated combined Hot Prospect + Top 3 HL total (a lead
    // counted once even if it's both), matching the funnel above and the
    // employee-level HP/HL column — not the old Hot-Prospect-only figure.
    // Scoped by the current Turnover filter, exact (not approximated).
    const s = empScopedMetrics(metrics);
    const metAlone = s.total - s.l2met;
    cells.push(fmtNum(s.total), fmtNum(s.l2met), fmtNum(metAlone), fmtNum(s.converted), fmtNum(s.convertedMet));
  } else {
    cells.push(
      '<span class="empty-cell">—</span>','<span class="empty-cell">—</span>','<span class="empty-cell">—</span>',
      '<span class="empty-cell">—</span>','<span class="empty-cell">—</span>'
    );
  }
  cells.push(fmtNum(empScopedTotalMeet(metrics)));
  return cells;
}
function escHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const FUNNEL_PERIODS = ['wtd', 'mtd'].concat(PERF_WEEK_PERIODS);

function fmtPctSimple(numerator, denominator){
  const n = Number(numerator) || 0;
  const d = Number(denominator) || 0;
  if(d === 0) return '—';
  return (n / d * 100).toFixed(1) + '%';
}
function fmtRatio(numerator, denominator, decimals){
  const n = Number(numerator) || 0;
  const d = Number(denominator) || 0;
  if(d === 0) return '—';
  return (n / d).toFixed(decimals === undefined ? 1 : decimals);
}

function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }
function titleCase(s){ return String(s).replace(/[_\-]+/g,' ').replace(/\b\w/g, c => c.toUpperCase()); }

function highlightMatch(name){
  if(!searchTerm) return escHtml(name);
  const idx = String(name).toLowerCase().indexOf(searchTerm.toLowerCase());
  if(idx === -1) return escHtml(name);
  const s = String(name);
  return escHtml(s.slice(0,idx)) + '<mark>' + escHtml(s.slice(idx, idx+searchTerm.length)) + '</mark>' + escHtml(s.slice(idx+searchTerm.length));
}
function matches(name){
  if(!searchTerm) return false;
  return String(name||'').toLowerCase().includes(searchTerm.toLowerCase());
}

function renderPerfTree(){
  const tree = getFilteredTree();
  const showHot = hasHotFields(currentPeriod);
  const searching = searchTerm.length > 0;

  // When searching, auto-expand every branch that contains a match so the
  // person doesn't have to manually click through the hierarchy.
  if(searching){
    for(const [zm, zmNode] of Object.entries(tree)){
      let zmHasMatch = matches(zm);
      for(const [rm, rmNode] of Object.entries(zmNode.rm_children)){
        let rmHasMatch = matches(rm);
        for(const [loc, locNode] of Object.entries(rmNode.location_children)){
          const locHasMatch = matches(loc) || locNode.employees.some(e => matches(e.name));
          if(locHasMatch){ expanded.loc.add(zm+'||'+rm+'||'+loc); rmHasMatch = true; }
        }
        if(rmHasMatch){ expanded.rm.add(zm+'||'+rm); zmHasMatch = true; }
      }
      if(zmHasMatch) expanded.zm.add(zm);
    }
  }

  let html = `<div class="tree-panel">`;
  html += `<div class="tree-header">
    <div>Name</div><div class="num">HC</div>
    <div class="num">Total Sales</div>
    <div class="num">${showHot ? 'HP/HL Total' : 'Meetings'}</div>
    <div class="num">${showHot ? 'Met with Mgr' : ''}</div>
    <div class="num">${showHot ? 'Met Alone' : ''}</div>
    <div class="num">${showHot ? 'Sales on Them' : ''}</div>
    <div class="num">${showHot ? 'Sales on Them (Mgr)' : ''}</div>
    <div class="num">${showHot ? 'Total Meet' : ''}</div>
  </div>`;

  const zmNames = Object.keys(tree).sort((a,b) => tree[b].headcount - tree[a].headcount);
  for(const zm of zmNames){
    const zmNode = tree[zm];
    const zmKey = zm;
    const zmOpen = expanded.zm.has(zmKey) || (searching && matches(zm));
    const zmDim = searching && !matches(zm) && !zmOpen;
    const cells = metricCells(zmNode.metrics[currentPeriod], currentPeriod);
    html += `<div class="tree-row depth-0 ${zmDim?'dimmed':''}" data-toggle="zm" data-key="${escAttr(zmKey)}">
      <div class="name-cell"><span class="caret">${zmOpen?'▼':'▶'}</span>${highlightMatch(zm)} <span class="headcount-pill">(${zmNode.headcount})</span></div>
      <div class="num">${zmNode.headcount}</div>
      ${cells.map(c=>`<div class="num">${c}</div>`).join('')}
    </div>`;

    if(zmOpen){
      const rmNames = Object.keys(zmNode.rm_children).sort((a,b) => zmNode.rm_children[b].headcount - zmNode.rm_children[a].headcount);
      for(const rm of rmNames){
        const rmNode = zmNode.rm_children[rm];
        const rmKey = zmKey + '||' + rm;
        const rmOpen = expanded.rm.has(rmKey) || (searching && matches(rm));
        const rmDim = searching && !matches(rm) && !rmOpen;
        const rcells = metricCells(rmNode.metrics[currentPeriod], currentPeriod);
        html += `<div class="tree-row depth-1 ${rmDim?'dimmed':''}" data-toggle="rm" data-key="${escAttr(rmKey)}">
          <div class="name-cell"><span class="caret">${rmOpen?'▼':'▶'}</span>${highlightMatch(rm)} <span class="headcount-pill">(${rmNode.headcount})</span></div>
          <div class="num">${rmNode.headcount}</div>
          ${rcells.map(c=>`<div class="num">${c}</div>`).join('')}
        </div>`;

        if(rmOpen){
          const locNames = Object.keys(rmNode.location_children).sort((a,b) => rmNode.location_children[b].headcount - rmNode.location_children[a].headcount);
          for(const loc of locNames){
            const locNode = rmNode.location_children[loc];
            const locKey = rmKey + '||' + loc;
            const locOpen = expanded.loc.has(locKey) || (searching && matches(loc));
            const locDim = searching && !matches(loc) && !locOpen;

              const byManager = new Map();
              for(const emp of locNode.employees){

                if(!byManager.has(mgr)) byManager.set(mgr, []);
                byManager.get(mgr).push(emp);

              const managerNames = [...byManager.keys()].sort((a,b) => a.localeCompare(b));

// ---------------------------------------------------------------------
// App Install view
// Unit = GLID, counted once per period (per vertical), credited to the
// L1 who did the FIRST meeting with it in that period.
//   Had app       : first install before that meeting
//   Installed after: no app at the meeting, installed on/after it (the drive)
//   Not installed : still no app -- the open opportunity
//   Drive %       : installed after / (installed after + not installed)
//   Coverage %    : (had app + installed after) / GLIDs met
// ---------------------------------------------------------------------
const MIN_BASE_NODE = 20;   // ZM/RM/Location: min GLIDs without app before a Drive % is judged
const MIN_BASE_EMP = 5;     // employee level

function pctNum(n, d){ return d ? n / d * 100 : null; }
function fmtP(v){ return v === null || v === undefined ? '—' : v.toFixed(1) + '%'; }
function driveBase(m){ m = m || {}; return (m.app_after || 0) + (m.app_none || 0); }
function driveOf(m){ m = m || {}; return pctNum(m.app_after || 0, driveBase(m)); }
function coverageOf(m){ m = m || {}; return pctNum((m.app_before || 0) + (m.app_after || 0), m.app_met || 0); }
function appTotals(nodes, period){
  const t = { app_met:0, app_before:0, app_after:0, app_none:0 };
  Object.values(nodes).forEach(n => {
    const m = n.metrics && n.metrics[period];
    if(!m) return;
    APP_KEYS.forEach(k => { t[k] += m[k] || 0; });
  });
  return t;
}

function renderBarStages(stages){
  const maxVal = Math.max(1e-9, ...stages.map(s => s.value || 0));
  const bars = stages.map(s => `
    <div class="bar-col">
      <div class="bar-value">${s.display !== undefined ? s.display : fmtNum(s.value)}</div>
      <div class="bar-pct">${s.pct ?? ''}</div>
      <div class="bar-shape" style="height:${Math.max(2, ((s.value || 0) / maxVal * 100))}%${s.color ? ';background:' + s.color : ''}"></div>
    </div>`).join('');
  const labels = stages.map(s => `<div class="bar-label">${escHtml(s.label)}</div>`).join('');
  return `<div class="bar-chart">${bars}</div><div class="bar-labels">${labels}</div>`;
}

// One level below whatever the filters currently scope to: ZMs -> RMs -> Locations.
function appBreakdownNodes(tree){
  const out = [];
  let level = 'ZM';
  if(currentRmFilter !== 'all' || currentLocationFilter.length){
    level = 'Location';
    Object.values(tree).forEach(z => Object.values(z.rm_children).forEach(r =>
      Object.entries(r.location_children).forEach(([n, node]) => out.push([n, node]))));
  } else if(currentZmFilter !== 'all'){
    level = 'RM';
    Object.values(tree).forEach(z => Object.entries(z.rm_children).forEach(([n, node]) => out.push([n, node])));
  } else {
    Object.entries(tree).forEach(([n, node]) => out.push([n, node]));
  }
  return { level, nodes: out };
}

function renderAppPanel(){
  const panel = document.getElementById('funnel-panel');
  if(!dashboardData.app_meta){
    panel.innerHTML = `<div class="app-empty">No app-install data yet. It arrives with the daily <code>push_local.py</code> run (Redash query 52336); if that failed, use <b>Manual upload…</b> in the App install row.</div>`;
    return;
  }
  const tree = getFilteredTree();
  const p = currentAppPeriod;
  const t = appTotals(tree, p);
  const without = driveBase(t);
  const drive = driveOf(t);
  const periodLabel = escHtml(appPeriodLabel(p));

  const funnel = [
    { label:'GLIDs Met', value:t.app_met, pct:null },
    { label:'No App at Meeting', value:without, pct:fmtPctSimple(without, t.app_met) },
    { label:'Installed After Meeting', value:t.app_after, pct:fmtPctSimple(t.app_after, without), color:'var(--teal)' },
  ];

  const weeks = APP_WEEKS.map(w => {
    const wt = appTotals(tree, w);
    const d = driveOf(wt);
    return { label:appPeriodLabel(w).replace('Wk ', ''), value:d || 0,
             display:fmtP(d), pct:`${fmtNum(wt.app_after)} of ${fmtNum(driveBase(wt))}`,
             color: w === p ? 'var(--navy)' : 'var(--slate)' };
  });

  const { level, nodes } = appBreakdownNodes(tree);
  const ranked = nodes
    .map(([name, node]) => { const m = node.metrics[p] || {}; return { name, drive:driveOf(m), base:driveBase(m), met:m.app_met || 0 }; })
    .filter(r => r.base >= MIN_BASE_NODE)
    .sort((a, b) => b.drive - a.drive);
  const skipped = nodes.length - ranked.length;
  const scaleMax = Math.max(1, ...ranked.map(r => r.drive), drive || 0) * 1.08;
  const hbars = ranked.length ? ranked.map(r => `
    <div class="hbar-row" title="${escAttr(r.name)}: ${fmtNum(r.met)} GLIDs met, ${fmtNum(r.base)} without app">
      <div class="hb-name">${escHtml(r.name)}</div>
      <div class="hbar-track">
        <div class="hbar-fill ${drive !== null && r.drive < drive ? 'bad' : ''}" style="width:${(r.drive / scaleMax * 100).toFixed(1)}%"></div>
        ${drive !== null ? `<div class="hbar-avg" style="left:${(drive / scaleMax * 100).toFixed(1)}%"></div>` : ''}
      </div>
      <div class="hb-val">${fmtP(r.drive)}</div>
    </div>`).join('') : `<div class="multiselect-empty">Not enough GLIDs in this selection.</div>`;

  const cards = [
    { label:'GLIDs Met', value:fmtNum(t.app_met) },
    { label:'Already Had App', value:`${fmtNum(t.app_before)} <span class="headcount-pill">${fmtPctSimple(t.app_before, t.app_met)}</span>` },
    { label:'Installed After Meeting', value:fmtNum(t.app_after) },
    { label:'Still Not Installed', value:fmtNum(t.app_none) },
    { label:'Drive %', value:fmtP(drive) },
    { label:'App Coverage %', value:fmtP(coverageOf(t)) },
  ];

  const outside = (dashboardData.extras_report && dashboardData.extras_report.app && dashboardData.extras_report.app.unplaced_units) || {};
  const outsideNote = outside[p] ? ` ${fmtNum(outside[p])} GLIDs met by partner-office staff sit under “(Partner / outside hierarchy)”.` : '';

  panel.innerHTML = `
    <div class="funnel-grid">
      <div class="funnel-col">
        <div class="funnel-header"><h2>App Install Funnel</h2><span class="sub">${periodLabel}</span></div>
        ${renderBarStages(funnel)}
      </div>
      <div class="funnel-col">
        <div class="funnel-header"><h2>Drive % — Weekly Trend</h2><span class="sub">Installed after ÷ GLIDs without app, last 3 full weeks</span></div>
        ${renderBarStages(weeks)}
      </div>
      <div class="funnel-col">
        <div class="funnel-header"><h2>Drive % by ${level}</h2><span class="sub">${periodLabel} · line = overall ${fmtP(drive)} · rust = below overall</span></div>
        <div class="hbar-list">${hbars}</div>
        ${skipped > 0 ? `<div class="app-note" style="margin-top:6px">${skipped} ${level.toLowerCase()}(s) with fewer than ${MIN_BASE_NODE} GLIDs without the app not ranked.</div>` : ''}
      </div>
    </div>
    <div class="funnel-cards">
      ${cards.map(c => `<div class="funnel-card"><div class="label">${escHtml(c.label)}</div><div class="value">${c.value}</div></div>`).join('')}
    </div>
    ${renderAppLeaders(tree, p, drive)}
    <p class="app-note">Each GLID is counted once per period (per vertical), credited to the L1 who did the first meeting with it in that period.
      <b>Drive %</b> = installed after the meeting ÷ GLIDs that didn't have the app at the meeting. <b>Coverage %</b> = GLIDs that now have the app ÷ GLIDs met.${outsideNote}</p>`;
  panel.querySelectorAll('[data-employee]').forEach(el =>
    el.addEventListener('click', () => openEmployeeModal(el.dataset.employee)));
}

// ---------------------------------------------------------------------
// Top 5 / Bottom 5 L1s and L2s by Drive %, within the current filters.
// Only people with enough GLIDs without the app are ranked, so one lucky
// install out of two meetings doesn't top the list.
// ---------------------------------------------------------------------
const LEADER_MIN_L1 = 10;   // GLIDs without app at the meeting
const LEADER_MIN_L2 = 30;

function appLeaderRows(tree, p){
  const l1 = [], l2 = new Map();
  for(const z of Object.values(tree)) for(const r of Object.values(z.rm_children))
    for(const [loc, l] of Object.entries(r.location_children)) for(const e of l.employees){
      const m = e.metrics[p] || {};
      if(!m.app_met) continue;
      l1.push({ id:e.id, name:e.name || e.id, sub:`${loc} · ${e.manager_name || 'No L2'}`, m });
      const mgr = e.manager_name;
      if(!mgr) continue;
      if(!l2.has(mgr)) l2.set(mgr, { name:mgr, locs:new Set(), team:0, m:{ app_met:0, app_before:0, app_after:0, app_none:0 } });
      const g = l2.get(mgr);
      g.locs.add(loc); g.team += 1;
      APP_KEYS.forEach(k => { g.m[k] += m[k] || 0; });
    }
  const l2rows = [...l2.values()].map(g => ({ name:g.name,
    sub:`${g.team} L1${g.team > 1 ? 's' : ''} · ${[...g.locs].slice(0, 2).join(', ')}${g.locs.size > 2 ? ` +${g.locs.size - 2}` : ''}`, m:g.m }));
  return { l1, l2:l2rows };
}

function rankTopBottom(rows, minBase){
  const eligible = rows.filter(r => driveBase(r.m) >= minBase)
    .map(r => Object.assign(r, { d:driveOf(r.m) }));
  // Best first; ties broken by the bigger base (more installs driven).
  const best = [...eligible].sort((a, b) => b.d - a.d || driveBase(b.m) - driveBase(a.m));
  const worst = [...eligible].sort((a, b) => a.d - b.d || driveBase(b.m) - driveBase(a.m));
  const top = best.slice(0, 5);
  const topSet = new Set(top);
  return { top, bottom: worst.filter(r => !topSet.has(r)).slice(0, 5), eligible: eligible.length, total: rows.length };
}

function leaderTable(title, rows, kind, avg){
  if(!rows.length) return `<div class="lead-block"><div class="lead-title">${title}</div><div class="multiselect-empty">Not enough data.</div></div>`;
  return `<div class="lead-block"><div class="lead-title">${title}</div>
    <table class="lead-table"><thead><tr><th>${kind}</th><th>GLIDs Met</th><th>No App</th><th>Installed After</th><th>Drive %</th></tr></thead><tbody>
    ${rows.map(r => `<tr ${r.id ? `data-employee="${escAttr(r.id)}" class="clickable"` : ''}>
      <td><div class="lead-name">${escHtml(r.name)}</div><div class="lead-sub">${escHtml(r.sub)}</div></td>
      <td>${fmtNum(r.m.app_met)}</td><td>${fmtNum(driveBase(r.m))}</td><td>${fmtNum(r.m.app_after)}</td>
      <td class="${avg !== null && r.d < avg ? 'bad' : 'good'}">${fmtP(r.d)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function renderAppLeaders(tree, p, avg){
  const { l1, l2 } = appLeaderRows(tree, p);
  const a = rankTopBottom(l1, LEADER_MIN_L1), b = rankTopBottom(l2, LEADER_MIN_L2);
  return `<div class="lead-grid">
    <div class="funnel-col">
      <div class="funnel-header"><h2>L1s — Top 5 &amp; Bottom 5 by Drive %</h2>
        <span class="sub">${escHtml(appPeriodLabel(p))} · ${a.eligible} of ${a.total} L1s ranked (min ${LEADER_MIN_L1} GLIDs without app)</span></div>
      ${leaderTable('Top 5', a.top, 'L1', avg)}${leaderTable('Bottom 5', a.bottom, 'L1', avg)}
    </div>
    <div class="funnel-col">
      <div class="funnel-header"><h2>L2s — Top 5 &amp; Bottom 5 by Drive %</h2>
        <span class="sub">${escHtml(appPeriodLabel(p))} · ${b.eligible} of ${b.total} L2s ranked (min ${LEADER_MIN_L2} GLIDs without app) · team totals</span></div>
      ${leaderTable('Top 5', b.top, 'L2', avg)}${leaderTable('Bottom 5', b.bottom, 'L2', avg)}
    </div>
  </div>`;
}

function appCellsHtml(m, avgDrive, minBase, cellClass){
  m = m || {};
  const d = driveOf(m);
  const flag = d !== null && avgDrive !== null && driveBase(m) >= minBase && d < avgDrive;
  const c = cellClass;
  return `
    <div class="${c}">${fmtNum(m.app_met || 0)}</div>
    <div class="${c}">${fmtNum(m.app_before || 0)}</div>
    <div class="${c}">${fmtNum(m.app_after || 0)}</div>
    <div class="${c}">${fmtNum(m.app_none || 0)}</div>
    <div class="${c} ${flag ? 'bad' : ''}">${fmtP(d)}</div>
    <div class="${c}">${fmtP(coverageOf(m))}</div>`;
}

function renderAppTree(){
  if(!dashboardData.app_meta){ contentEl.innerHTML = ''; return; }
  const tree = getFilteredTree();
  const p = currentAppPeriod;
  const avg = driveOf(appTotals(tree, p));

  let html = `<div class="tree-panel app-mode">
    <div class="tree-header">
      <div>Name</div><div class="num">HC</div>
      <div class="num">GLIDs Met</div><div class="num">Had App</div><div class="num">Installed After</div>
      <div class="num">Not Installed</div><div class="num">Drive %</div><div class="num">Coverage %</div>
    </div>`;

  const byHc = (obj) => Object.keys(obj).sort((a, b) => (obj[b].headcount - obj[a].headcount) || a.localeCompare(b));
  for(const zm of byHc(tree)){
    const zmNode = tree[zm];
    const zmOpen = expanded.zm.has(zm);
    html += `<div class="tree-row depth-0" data-toggle="zm" data-key="${escAttr(zm)}">
      <div class="name-cell"><span class="caret">${zmOpen ? '▼' : '▶'}</span>${escHtml(zm)}</div>
      <div class="num">${zmNode.headcount}</div>${appCellsHtml(zmNode.metrics[p], avg, MIN_BASE_NODE, 'num')}</div>`;
    if(!zmOpen) continue;
    for(const rm of byHc(zmNode.rm_children)){
      const rmNode = zmNode.rm_children[rm];
      const rmKey = zm + '||' + rm;
      const rmOpen = expanded.rm.has(rmKey);
      html += `<div class="tree-row depth-1" data-toggle="rm" data-key="${escAttr(rmKey)}">
        <div class="name-cell"><span class="caret">${rmOpen ? '▼' : '▶'}</span>${escHtml(rm)}</div>
        <div class="num">${rmNode.headcount}</div>${appCellsHtml(rmNode.metrics[p], avg, MIN_BASE_NODE, 'num')}</div>`;
      if(!rmOpen) continue;
      for(const loc of byHc(rmNode.location_children)){
        const locNode = rmNode.location_children[loc];
        const locKey = rmKey + '||' + loc;
        const locOpen = expanded.loc.has(locKey);
        html += `<div class="tree-row depth-2" data-toggle="loc" data-key="${escAttr(locKey)}">
          <div class="name-cell"><span class="caret">${locOpen ? '▼' : '▶'}</span>${escHtml(loc)}</div>
          <div class="num">${locNode.headcount}</div>${appCellsHtml(locNode.metrics[p], avg, MIN_BASE_NODE, 'num')}</div>`;
        if(!locOpen) continue;
        html += renderAppEmployees(locNode, p, avg);
      }
    }
  }
  html += `</div>`;
  contentEl.innerHTML = html;

  contentEl.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const level = el.dataset.toggle, key = el.dataset.key;
      if(expanded[level].has(key)) expanded[level].delete(key); else expanded[level].add(key);
      renderAppTree();
    });
  });
  contentEl.querySelectorAll('[data-employee]').forEach(el => {
    el.addEventListener('click', () => openEmployeeModal(el.dataset.employee));
  });
}

function renderAppEmployees(locNode, p, avg){
  let html = `<div class="emp-table app-emp">
    <div class="emp-header">
      <div class="emp-name-head">Name</div><div class="emp-num">Tenure</div>
      <div class="emp-num">GLIDs Met</div><div class="emp-num">Had App</div><div class="emp-num">Installed After</div>
      <div class="emp-num">Not Installed</div><div class="emp-num">Drive %</div><div class="emp-num">Coverage %</div>
    </div>`;
  const byManager = new Map();
  for(const emp of locNode.employees){
    const mgr = emp.manager_name || '(No Manager)';
    if(!byManager.has(mgr)) byManager.set(mgr, []);
    byManager.get(mgr).push(emp);
  }
  const empSum = { app_met:0, app_before:0, app_after:0, app_none:0 };
  for(const mgr of [...byManager.keys()].sort((a, b) => a.localeCompare(b))){
    // Biggest open opportunity (not installed) first.
    const team = [...byManager.get(mgr)].sort((a, b) =>
      ((b.metrics[p] || {}).app_none || 0) - ((a.metrics[p] || {}).app_none || 0) || (a.name || '').localeCompare(b.name || ''));
    const agg = { app_met:0, app_before:0, app_after:0, app_none:0 };
    team.forEach(e => APP_KEYS.forEach(k => { const v = (e.metrics[p] || {})[k] || 0; agg[k] += v; empSum[k] += v; }));
    html += `<div class="emp-row emp-manager-row">
      <div class="emp-name">${escHtml(mgr)} <span class="headcount-pill">(${team.length})</span></div><div class="emp-num"></div>
      ${appCellsHtml(agg, avg, MIN_BASE_EMP, 'emp-num')}</div>`;
    for(const emp of team){
      html += `<div class="emp-row" data-employee="${escAttr(emp.id)}">
        <div class="emp-name">${escHtml(emp.name || emp.id)}</div><div class="emp-num">${fmtNum(emp.tenure)}</div>
        ${appCellsHtml(emp.metrics[p], avg, MIN_BASE_EMP, 'emp-num')}</div>`;
    }
  }
  // GLIDs met by people who aren't L1s in the main data (L2s, partner staff,
  // L1s missing from the query) are added at location level -- show them so
  // the employee rows visibly add up to the location row.
  const lm = locNode.metrics[p] || {};
  const other = {};
  APP_KEYS.forEach(k => { other[k] = (lm[k] || 0) - empSum[k]; });
  if(other.app_met > 0){
    html += `<div class="emp-row emp-manager-row" title="GLIDs met by staff at this location who aren't in the L1 list (e.g. L2s, partner staff)">
      <div class="emp-name">Others at this location (not in L1 list)</div><div class="emp-num"></div>
      ${appCellsHtml(other, avg, MIN_BASE_EMP, 'emp-num')}</div>`;
  }
  return html + `</div>`;
}

function findEmployeeSummary(id){
  for(const z of Object.values(dashboardData.tree))
    for(const r of Object.values(z.rm_children))
      for(const l of Object.values(r.location_children))
        for(const e of l.employees) if(String(e.id) === String(id)) return e;
  return null;
}

function buildAppHistoryHtml(summary){
  if(!dashboardData.app_meta || !summary) return '';
  const rows = APP_PERIOD_ORDER.map(p => {
    const m = summary.metrics[p] || {};
    return `<tr><td>${escHtml(appPeriodLabel(p))}</td><td>${fmtNum(m.app_met || 0)}</td><td>${fmtNum(m.app_before || 0)}</td>
      <td>${fmtNum(m.app_after || 0)}</td><td>${fmtNum(m.app_none || 0)}</td><td>${fmtP(driveOf(m))}</td></tr>`;
  }).join('');
  return `<div class="modal-section-label">App Install</div>
    <table class="app-hist"><thead><tr><th>Period</th><th>GLIDs Met</th><th>Had App</th><th>Installed After</th><th>Not Installed</th><th>Drive %</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// ---------------------------------------------------------------------
// Employee detail modal — Profile (period-independent) + Performance
// section filtered to whichever period tab is currently selected.
// ---------------------------------------------------------------------
function fmtPct(numerator, denominator){
  const n = Number(numerator) || 0;
  const d = Number(denominator) || 0;
  if(d === 0) return '—';
  return (n / d * 100).toFixed(1) + '%';
}
function fieldRow(label, value){
  const display = (value === null || value === undefined || value === '') ? '—' : value;
  return `<div class="kv-row"><span class="k">${escHtml(label)}</span><span class="v">${escHtml(display)}</span></div>`;
}
function notTrackedRow(label){
  return `<div class="kv-row"><span class="k">${escHtml(label)}</span><span class="v empty-cell">Not tracked at this period</span></div>`;
}

function buildEmployeeDetailHtml(emp, period){
  const fields = EMPLOYEE_PERIOD_FIELDS[period];
  const get = (col) => col ? emp[col] : undefined;

  let profileRows = PROFILE_FIELDS.map(f => fieldRow(f.label, emp[f.key])).join('');

  const perfRows = [];
  perfRows.push(fieldRow('Sales (count)', fmtNum(get(fields.sales_count))));

  if(fields.hot_total !== null){
    perfRows.push(fieldRow('Hot Prospects Added', fmtNum(get(fields.hot_total))));
    perfRows.push(fieldRow('Hot Meetings — Self', fmtNum(get(fields.hot_self))));
    perfRows.push(fieldRow('Hot Meetings — With Manager', fmtNum(get(fields.hot_mgr))));
  } else {
    perfRows.push(notTrackedRow('Hot Prospects Added'));
    perfRows.push(notTrackedRow('Hot Meetings — Self'));
    perfRows.push(notTrackedRow('Hot Meetings — With Manager'));
  }

  if(fields.total_attempts !== null){
    perfRows.push(fieldRow('Total Attempts', fmtNum(get(fields.total_attempts))));
    perfRows.push(fieldRow('Unique Answered', fmtNum(get(fields.unique_answered))));
    perfRows.push(fieldRow('Avg Talktime', get(fields.talktime)));
  } else {
    perfRows.push(notTrackedRow('Total Attempts'));
    perfRows.push(notTrackedRow('Unique Answered'));
    perfRows.push(notTrackedRow('Avg Talktime'));
  }

  const totalMeet = get(fields.total_meet);
  const freshCount = get(fields.fresh_meet);
  const followupCount = get(fields.followup_meet);
  perfRows.push(fieldRow('Total Meetings', fmtNum(totalMeet)));
  perfRows.push(fieldRow('Fresh Meetings', `${fmtNum(freshCount)} (${fmtPct(freshCount, totalMeet)})`));
  perfRows.push(fieldRow('Followup Meetings', `${fmtNum(followupCount)} (${fmtPct(followupCount, totalMeet)})`));
  perfRows.push(fieldRow('Meetings — Self', fmtNum(get(fields.self_meet))));
  perfRows.push(fieldRow('Meetings — With Manager', fmtNum(get(fields.with_mgr_meet))));
  perfRows.push(fieldRow('HL Assigned', fmtNum(get(fields.hl_assigned))));
  perfRows.push(fieldRow('HL Meetings Done', fmtNum(get(fields.hl_done))));

  return `
    <div class="modal-section-label">Profile</div>
    <div class="kv-grid">${profileRows}</div>
    <div class="modal-section-label">Performance — ${escHtml(periodLabel(period))}</div>
    <div class="kv-grid">${perfRows.join('')}</div>
  `;
}

async function openEmployeeModal(employeeId){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal"><div class="loading">Loading employee detail…</div></div></div>`;
  root.querySelector('.modal-backdrop').addEventListener('click', (e) => {
    if(e.target.classList.contains('modal-backdrop')) root.innerHTML = '';
  });
  try{
    const res = await fetch(`/api/employee/${encodeURIComponent(employeeId)}?vertical=${encodeURIComponent(currentVertical)}`);
    const payload = await res.json();
    if(!payload.ok){
      root.querySelector('.modal').innerHTML = `<button class="modal-close" onclick="document.getElementById('modal-root').innerHTML=''">Close</button><div class="error-banner">${escHtml(payload.error)}</div>`;
      return;
    }
    const emp = payload.employee;
    const name = emp.employeename || employeeId;
    root.querySelector('.modal').innerHTML = `
      <button class="modal-close" id="modal-close-btn">Close</button>
      <h3>${escHtml(name)}</h3>
      <div class="sub">Employee ID: ${escHtml(employeeId)} — performance shows ${escHtml(periodLabel(currentPeriod))} figures (the period selected in the Performance view)</div>
      ${currentView === 'app' ? buildAppHistoryHtml(findEmployeeSummary(employeeId)) : ''}
      ${buildEmployeeDetailHtml(emp, currentPeriod)}
      ${currentView === 'app' ? '' : buildAppHistoryHtml(findEmployeeSummary(employeeId))}
    `;
    document.getElementById('modal-close-btn').addEventListener('click', () => { root.innerHTML=''; });
  } catch(e){
    root.querySelector('.modal').innerHTML = `<div class="error-banner">Connection error loading employee detail.</div>`;
  }
}

async function fetchDashboard(force){
  refreshBtn.disabled = true;
  try{
    const params = new URLSearchParams();
    if(force) params.set('refresh', '1');
    params.set('vertical', currentVertical);
    const res = await fetch('/api/dashboard-data?' + params.toString(), { headers: {'Accept-Encoding':'gzip'} });
    const payload = await res.json();
    if(!payload.ok){
      pulseDot.className = 'pulse error';
      contentEl.innerHTML = `<div class="error-banner">Couldn't load data.<br><code>${escHtml(payload.error)}</code></div>`;
      updatedTextEl.textContent = 'error';
      return;
    }
    pulseDot.className = 'pulse';
    dashboardData = payload;
    titleEl.textContent = payload.title || 'Dashboard';
    updatedTextEl.textContent = 'data as of ' + relativeTime(payload.redash_cached_at) +
      (payload.perf_meta ? ' · weeks/MTD ' + relativeTime(payload.perf_meta.uploaded_at) : '');
    hierarchyStatusEl.textContent = payload.hierarchy_row_count
      ? `${fmtNum(payload.hierarchy_row_count)} L1s · ${relativeTime(payload.hierarchy_uploaded_at)}`
      : 'not uploaded yet';
    if(payload.unmapped_count > 0){
      hierarchyStatusEl.textContent += ` · ${payload.unmapped_count} L1s not in sheet`;
    }
    hierarchyStatusEl.classList.toggle('warn', !payload.hierarchy_row_count || payload.unmapped_count > 0);
    hierarchyStatusEl.title = hierarchyStatusEl.textContent;
    updateDumpStatuses(payload);
    if(payload.ambiguous_locations && payload.ambiguous_locations.length > 0){
      hierarchyStatusEl.textContent += ` — ⚠ ${payload.ambiguous_locations.length} location(s) appear under multiple RMs, assigned to whichever RM has the most people there: ${payload.ambiguous_locations.slice(0,5).join(', ')}${payload.ambiguous_locations.length > 5 ? '…' : ''}`;
    }
    if(payload.unmatched_locations && payload.unmatched_locations.length > 0){
      hierarchyStatusEl.textContent += ` — ⚠ ${payload.unmatched_locations.length} location(s) not found in the location-sales query (name mismatch?), still using summed figures for those: ${payload.unmatched_locations.slice(0,5).join(', ')}${payload.unmatched_locations.length > 5 ? '…' : ''}`;
    }
    if(payload.available_verticals){
      const current = verticalSelectEl.value;
      verticalSelectEl.innerHTML = '<option value="all">All Verticals</option>' +
        payload.available_verticals.map(v => `<option value="${escAttr(v.value)}">${escHtml(v.label)}</option>`).join('');
      verticalSelectEl.value = current || 'all';
    }
    renderAll();
  } catch(e){
    pulseDot.className = 'pulse error';
    updatedTextEl.textContent = 'connection error';
  } finally {
    refreshBtn.disabled = false;
  }
}

// ---------------------------------------------------------------------
// Sales dump + App-install dump uploads
// ---------------------------------------------------------------------
const salesStatusEl = document.getElementById('sales-status');
const appStatusEl = document.getElementById('app-status');
let appJobPolling = false;

function fmtShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}

function updateDumpStatuses(payload){
  const sm = payload.sales_meta;
  if(sm){
    const st = sm.stats || {};
    // as_of is exclusive (periods run up to the day before the upload date)
    const upto = new Date(sm.as_of + 'T00:00:00'); upto.setDate(upto.getDate() - 1);
    let txt = `${fmtNum(st.sales_kept)} sales · up to ${upto.toLocaleDateString('en-IN', {day:'numeric', month:'short'})} · ${relativeTime(sm.uploaded_at)}`;
    const out = payload.extras_report && payload.extras_report.sales && payload.extras_report.sales.unplaced_units;
    if(out && out.mtd) txt += ` · ${out.mtd} at partner offices`;
    salesStatusEl.textContent = txt;
    salesStatusEl.title = `Rows read ${fmtNum(st.rows_read)} · kept ${fmtNum(st.sales_kept)} · dropped by receipt/sale status ${fmtNum(st.dropped_by_status)} · other verticals ${fmtNum(st.out_of_scope_vertical)} · duplicate receipts ${fmtNum(st.dropped_duplicate_receipt)}`;
    salesStatusEl.classList.remove('warn');
  } else {
    salesStatusEl.textContent = 'not uploaded — sales show as 0';
    salesStatusEl.title = '';
    salesStatusEl.classList.add('warn');
  }
  if(appJobPolling) return;   // the poller owns the text while a file is processing
  const am = payload.app_meta;
  if(am){
    const st = am.stats || {};
    const src = am.source === 'redash' ? 'from Redash' : 'manual file';
    const ageDays = (Date.now() / 1000 - am.uploaded_at) / 86400;
    appStatusEl.textContent = `${src} · ${fmtNum(st.meetings_read)} meetings · ${relativeTime(am.uploaded_at)}`;
    appStatusEl.title = appStatusEl.textContent + (ageDays > 1.5 ? ' — older than a day: check the daily push_local.py run' : '');
    // Flag it if the daily automatic push seems to have stopped.
    appStatusEl.classList.toggle('warn', ageDays > 1.5);
  } else {
    appStatusEl.textContent = 'waiting for the daily push';
    appStatusEl.classList.add('warn');
  }
}

async function postFile(url, file){
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch(url, { method:'POST', body: formData });
  return res.json();
}

const salesUploadBtn = document.getElementById('sales-upload');
const salesFileInput = document.getElementById('sales-file');
salesUploadBtn.addEventListener('click', async () => {
  const file = salesFileInput.files[0];
  if(!file){ alert('Choose the sales dump (.xlsx) first.'); return; }
  salesUploadBtn.disabled = true; salesUploadBtn.textContent = 'Uploading…';
  try{
    const payload = await postFile('/api/upload-sales', file);
    if(!payload.ok){ alert('Upload failed: ' + payload.error); }
    else { salesFileInput.value = ''; await fetchDashboard(false); }
  } catch(e){
    alert('Upload failed: connection error.');
  } finally {
    salesUploadBtn.disabled = false; salesUploadBtn.textContent = 'Upload';
  }
});

const appUploadBtn = document.getElementById('app-upload');
const appFileInput = document.getElementById('app-file');
async function pollAppJob(){
  appJobPolling = true;
  appUploadBtn.disabled = true;
  const started = Date.now();
  try{
    while(true){
      const s = await (await fetch('/api/upload-appinstall-status')).json();
      if(s.state === 'processing'){
        appStatusEl.textContent = `processing… ${Math.round((Date.now() - started) / 1000)}s`;
        appStatusEl.classList.remove('warn');
        await new Promise(r => setTimeout(r, 2000));
        continue;
      }
      if(s.state === 'error') alert(s.error || 'App-install upload failed.');
      break;
    }
  } catch(e){
    alert('Lost connection while the app-install file was processing — press Refresh data in a minute.');
  } finally {
    appJobPolling = false;
    appUploadBtn.disabled = false; appUploadBtn.textContent = 'Manual upload…';
    await fetchDashboard(false);
  }
}
// App install arrives automatically; the button only opens a file picker as a backup.
appUploadBtn.addEventListener('click', () => appFileInput.click());
appFileInput.addEventListener('change', async () => {
  const file = appFileInput.files[0];
  if(!file) return;
  appUploadBtn.disabled = true; appUploadBtn.textContent = 'Uploading…';
  appStatusEl.textContent = 'uploading…';
  try{
    const payload = await postFile('/api/upload-appinstall', file);
    if(!payload.ok){
      alert('Upload failed: ' + payload.error);
      appUploadBtn.disabled = false; appUploadBtn.textContent = 'Manual upload…';
      return;
    }
    appFileInput.value = '';
    await pollAppJob();
  } catch(e){
    alert('Upload failed: connection error.');
    appUploadBtn.disabled = false; appUploadBtn.textContent = 'Manual upload…';
  }
});

document.querySelectorAll('#view-switch button').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));
setView(currentView);

// If a file was already processing when the page opened, keep watching it.
fetch('/api/upload-appinstall-status').then(r => r.json()).then(s => { if(s.state === 'processing') pollAppJob(); }).catch(() => {});

fetchDashboard(false);
setInterval(() => fetchDashboard(false), 5 * 60 * 1000);
